<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tavolo — classic card games</title>
<meta name="description" content="Classic card games in your browser: Briscola, Scopa, Rubamazzo and more. Play against bots, offline, in 9 languages.">
<meta name="theme-color" content="#1f6f4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- suits of the Italian deck (original drawings) -->
  <symbol id="s-denari" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="currentColor"/><circle cx="12" cy="12" r="6.6" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.5"/><circle cx="12" cy="12" r="2.4" fill="#fff" fill-opacity=".8"/></symbol>
  <symbol id="s-coppe" viewBox="0 0 24 24"><path fill="currentColor" d="M4.5 2.5h15v4c0 4.2-3 6.9-5.7 7.6v3.4h2.7c.9 0 1.5.7 1.5 1.5v2.5H6v-2.5c0-.8.6-1.5 1.5-1.5h2.7v-3.4C7.5 13.400 4.5 10.700 4.5 6.500z"/></symbol>
  <symbol id="s-spade" viewBox="0 0 24 24"><path fill="currentColor" d="M12 1l2.700 4.200V14.500h3.800v2.700h-5V21a1.500 1.500 0 0 1-3 0v-3.800h-5v-2.700h3.800V5.200z"/></symbol>
  <symbol id="s-bastoni" viewBox="0 0 24 24"><path fill="currentColor" d="M17.200 1.800c2.900-.3 5.300 2.100 5 5-.2 1.900-1.600 3.100-3 4.200L7.700 21.300c-1.400 1.300-3.600 1.200-4.900-.1s-1.400-3.500-.1-4.900L13 5c.9-1.500 2.300-3 4.200-3.200z"/></symbol>
  <!-- interface icons -->
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-stats" viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-set" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.500"/><circle cx="8" cy="17" r="2.500"/></g></symbol>
  <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-inst" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.300 9.300a2.800 2.800 0 1 1 4.200 2.400c-.900.600-1.500 1.100-1.500 2.300"/></g><circle cx="12" cy="17.200" r="1.200" fill="currentColor"/></symbol>
  <symbol id="i-hint" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.500 10.900c.600.500 1 1.200 1 2.100h5c0-.900.400-1.600 1-2.100A6 6 0 0 0 12 3z"/></g></symbol>
  <symbol id="i-last" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.600-5.900"/><path d="M4 4.500v4.500h4.500"/><path d="M12 8v4.500l3 1.800"/></g></symbol>
  <symbol id="i-log" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/></g><circle cx="4.500" cy="6" r="1.300" fill="currentColor"/><circle cx="4.500" cy="12" r="1.300" fill="currentColor"/><circle cx="4.500" cy="18" r="1.300" fill="currentColor"/></symbol>
  <symbol id="i-pile" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="11" height="15" rx="2"/><path d="M9 21.500h8.500a2 2 0 0 0 2-2V8"/></g></symbol>
</svg>

<header class="bar">
  <button type="button" class="icon" id="btn-back" data-i18n="nav.back" hidden><svg><use href="#i-back"/></svg></button>
  <button type="button" class="brand" id="btn-home" data-i18n="nav.home">Tavolo</button>
  <span class="grow"></span>
  <button type="button" class="icon" id="btn-install" data-i18n="nav.install" hidden><svg><use href="#i-inst"/></svg></button>
  <button type="button" class="icon" id="btn-help" data-i18n="setup.rules" hidden><svg><use href="#i-help"/></svg></button>
  <button type="button" class="icon" id="btn-stats" data-i18n="nav.stats"><svg><use href="#i-stats"/></svg></button>
  <button type="button" class="icon" id="btn-full" data-i18n="nav.fullscreen"><svg><use href="#i-full"/></svg></button>
  <button type="button" class="icon" id="btn-settings" data-i18n="nav.settings"><svg><use href="#i-set"/></svg></button>
</header>
<main id="app"></main>
<noscript>Tavolo needs JavaScript to deal the cards.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
